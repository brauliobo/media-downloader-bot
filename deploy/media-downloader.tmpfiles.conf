# /etc/tmpfiles.d/media-downloader.conf: the work dirs of the bots and their workers, on the tmpfs of /tmp (a book's parts are many times
# its size, the disk cannot take them). Made at boot, and left out of the cleaning of /tmp by age.
d /tmp/media-downloader         0755 mdb mdb -
d /tmp/media-downloader/work    0755 mdb mdb -
d /tmp/media-downloader/work-tg 0755 mdb mdb -
x /tmp/media-downloader
