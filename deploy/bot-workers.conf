# Drop-in for media-downloader-tdbot.service and media-downloader-tgbot.service
# (/etc/systemd/system/media-downloader-<bot>.service.d/workers.conf): the bot keeps the Telegram client and hands the books to the workers.
#
# Per bot, the same TMPDIR as its workers: tdbot work, tgbot work-tg (set it to /tmp/media-downloader/work-tg in the tgbot's). The bot's
# service for the workers (BOT_HTTP, 1181 tdbot, 1180 tgbot) and BOT_HTTP_TOKEN stay in the bot's dotenv files.
[Service]
# The work dirs are on the host's tmpfs (see media-downloader.tmpfiles.conf), shared with the workers: the bot's /tmp must not be private.
PrivateTmp=no
Environment=TMPDIR=/tmp/media-downloader/work
# WITH_WORKER must not be set anywhere (drop-ins, .env.local): the bot would run the books itself.
