# PROPOSAL, not installed anywhere. Drop-in for media-downloader-tdbot.service and media-downloader-tgbot.service
# (/etc/systemd/system/media-downloader-<bot>.service.d/workers.conf): the bot keeps the Telegram client and hands the books to the workers.
#
# Per bot, set the same values as its workers: tdbot work + 1180, tgbot work-tg + 1181.
[Service]
StateDirectory=media-downloader/work
Environment=TMPDIR=/var/lib/media-downloader/work
# The bot's service for its workers: loopback only, BOT_HTTP_TOKEN (private environment file) is required.
Environment=BOT_HTTP=http://127.0.0.1:1180
# WITH_WORKER must not be set: the bot would run the books itself.
