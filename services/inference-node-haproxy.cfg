global
    maxconn 64
    log stdout format raw local0
    user haproxy
    group haproxy
    chroot /usr/share/haproxy

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 2h
    timeout server 2h
    timeout queue 10m

frontend omnivoice_node
    bind "${NODE_IP}:10440"
    acl infrastructure_health path -i /_infra/health
    http-request return status 200 content-type text/plain string ok if infrastructure_health
    default_backend omnivoice_workers

frontend hymt2_node
    bind "${NODE_IP}:12002"
    acl infrastructure_health path -i /_infra/health
    http-request return status 200 content-type text/plain string ok if infrastructure_health
    default_backend hymt2_workers

frontend whispercpp_node
    bind "${NODE_IP}:8080"
    acl infrastructure_health path -i /_infra/health
    http-request return status 200 content-type text/plain string ok if infrastructure_health
    default_backend whispercpp_workers

backend omnivoice_workers
    balance first
    option http-server-close
    server gpu0 127.0.0.1:10450 maxconn 1 no-check
.if defined(GPU1)
    server gpu1 127.0.0.1:10451 maxconn 1 no-check
.endif

backend hymt2_workers
    balance first
    option http-server-close
    server gpu0 127.0.0.1:12010 maxconn 1 no-check
.if defined(GPU1)
    server gpu1 127.0.0.1:12011 maxconn 1 no-check
.endif

backend whispercpp_workers
    balance first
    option http-server-close
    server gpu0 127.0.0.1:8180 maxconn 1 no-check
.if defined(GPU1)
    server gpu1 127.0.0.1:8181 maxconn 1 no-check
.endif
